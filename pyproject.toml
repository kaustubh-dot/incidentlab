[project]
name = "incidentlab"
version = "0.1.0"
description = "Bounded application-recovery agent and sandbox checkout application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "psycopg[binary]>=3.2.0",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "ollama>=0.4.0",
    "transformers>=4.45.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incidentlab"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
markers = [
    "integration: marks tests requiring local integration services",
    "live_model: marks explicit live model inference tests",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
